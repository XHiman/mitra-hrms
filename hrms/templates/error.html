{% extends "base.html" if current_user else "auth/_layout.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="panel">
  <h1>Error {{ code }}: {{ title }}</h1>
  <p>{{ message }}</p>
  <a class="btn secondary" href="{{ url_for('dashboards.home') }}">Return to dashboard</a>
</div>
{% endblock %}
